<div id="leads-review">
  <div class="viz-controls" aria-label="布局预览">
    <button class="btn" type="button" data-view="desktop" aria-pressed="true">桌面</button>
    <button class="btn" type="button" data-view="mobile" aria-pressed="false">手机</button>
    <span class="text-small">交互示例 · 合成数据 · 分页待确认</span>
  </div>
  <div class="at-product" aria-label="Leads 结果优先方案">
    <aside class="at-rail" aria-label="Primary navigation">
      <div class="at-brand">AT</div>
      <button type="button" disabled aria-label="Customer data"><i data-lucide="archive-restore" aria-hidden="true"></i></button>
      <button type="button" disabled aria-label="Dashboard"><i data-lucide="layout-dashboard" aria-hidden="true"></i></button>
      <button type="button" aria-current="page" aria-label="Leads"><i data-lucide="users" aria-hidden="true"></i></button>
      <button type="button" disabled aria-label="Agenda"><i data-lucide="calendar-days" aria-hidden="true"></i></button>
      <button type="button" disabled aria-label="Analytics"><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i></button>
      <div class="at-account">P</div>
    </aside>
    <div class="at-main">
      <header class="at-top"><button class="at-mobile-menu" type="button" disabled aria-label="Open navigation"><i data-lucide="menu" aria-hidden="true"></i></button><div><h2>Leads</h2><p>Manage customer leads, stages, and follow-up status.</p></div><span class="at-date">Nov 13, 2026</span><i data-lucide="bell" aria-hidden="true"></i></header>
      <main class="at-content">
        <div class="at-heading"><h3>All leads</h3><button type="button" class="at-primary" disabled data-tooltip="本轮仅审阅入口位置">＋ New Lead</button></div>
        <section class="at-toolbar" aria-label="Search and filters">
          <div class="at-common">
            <label class="at-search">Search · name, email, phone<div class="at-input-wrap"><input type="search" aria-label="Search leads by name, email, or phone" placeholder="Search leads" autocomplete="off"><button type="button" class="at-search-clear" aria-label="Clear search" hidden>×</button></div></label>
            <label>Status<select data-filter="status"><option value="">All statuses</option><option>Active</option><option>Lost</option><option>Delivered</option><option value="Closed">Closed (outcome unconfirmed)</option></select></label>
            <label>Stage<select data-filter="stage"><option value="">All stages</option><option>New</option><option>Contacted</option><option>Visited</option><option>Appointment</option><option>Test Drive</option><option>Negotiation</option><option>Delivered</option><option>Closed</option></select></label>
            <button type="button" class="at-more" aria-expanded="false" aria-controls="at-advanced"><i data-lucide="sliders-horizontal" aria-hidden="true"></i><span>More filters</span><span class="at-advanced-count" hidden></span><span class="at-chevron">⌄</span></button>
          </div>
          <div id="at-advanced" class="at-advanced" hidden>
            <div class="at-extra">
              <label>Trade-in<select data-filter="trade"><option value="">Any trade-in</option><option value="yes">Yes</option><option value="no">No</option></select></label>
              <label>Score<select data-filter="score"><option value="">Any score</option><option value="low">Below 50</option><option value="mid">50–79</option><option value="high">80+</option></select></label>
            </div>
            <h4>Vehicle interest</h4>
            <div class="at-vehicle">
              <label>Year<input data-filter="year" list="at-years" placeholder="Any year" autocomplete="off"></label>
              <label>Make<input data-filter="make" list="at-makes" placeholder="Any make" autocomplete="off"></label>
              <label>Model<input data-filter="model" list="at-models" placeholder="Any model" autocomplete="off"></label>
            </div>
            <datalist id="at-years"></datalist><datalist id="at-makes"></datalist><datalist id="at-models"></datalist>
            <button type="button" class="at-link at-collapse">Collapse filters ↑</button>
          </div>
        </section>
        <div class="at-result-head"><strong class="at-count" role="status" aria-live="polite">101 leads</strong><span class="at-order">Lead ID ↑</span></div>
        <div class="at-applied" aria-label="Applied filters" hidden><div class="at-chips"></div><button type="button" class="at-link at-reset">Clear all</button></div>
        <p class="at-dependency" role="status" aria-live="polite"></p>
        <section class="at-results" aria-label="Lead results">
          <div class="at-table-wrap"><table><thead><tr><th>Status</th><th>Name</th><th>Contact</th><th>Vehicle interest</th><th>Trade-in vehicle</th><th>Stage</th><th>Score</th><th>Last contact</th><th>Actions</th></tr></thead><tbody></tbody></table></div>
          <div class="at-mobile-results"></div>
          <div class="at-empty" hidden><i data-lucide="search-x" aria-hidden="true"></i><h3>No matching leads</h3><p>Check your search or remove a filter.</p><button type="button" class="at-primary at-empty-clear">Clear all</button></div>
          <footer class="at-pagination"><span class="at-range"></span><div class="at-page-controls"><label>Per page<select class="at-size"><option>5</option><option selected>10</option><option>25</option><option>50</option><option>100</option></select></label><button type="button" class="at-prev" aria-label="Previous page">‹</button><span class="at-page-num"></span><button type="button" class="at-next" aria-label="Next page">›</button></div></footer>
        </section>
        <div class="at-summary" hidden role="region" aria-label="Lead brief"><div class="at-summary-title"><h3>Lead brief</h3><button type="button" class="at-close" aria-label="Close lead brief">×</button></div><div class="at-summary-content"></div></div>
      </main>
    </div>
  </div>
</div>

{display:none}#leads-review .at-summary{margin-top:16px;padding:16px;background:var(--at-surface);border:1px solid var(--at-line);border-radius:10px}#leads-review .at-summary-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}#leads-review .at-summary-content{display:grid;gap:8px}#leads-review .at-summary-content dt{color:var(--at-muted);font-size:12px}#leads-review .at-summary-content dd{margin:0;overflow-wrap:anywhere}
#leads-review .at-product.is-mobile{max-width:390px;margin-left:auto;margin-right:auto;min-height:840px}#leads-review .is-mobile .at-rail{display:none}#leads-review .is-mobile .at-top{height:64px;padding:12px 16px}#leads-review .is-mobile .at-top p,#leads-review .is-mobile .at-date{display:none}#leads-review .is-mobile .at-top h2{font-size:21px}#leads-review .is-mobile .at-content{padding:16px}#leads-review .is-mobile .at-heading{margin-bottom:12px}#leads-review .is-mobile .at-toolbar{padding:12px}#leads-review .is-mobile .at-common{grid-template-columns:1fr 1fr;gap:10px}#leads-review .is-mobile .at-search{grid-column:1/-1}#leads-review .is-mobile .at-more{grid-column:1/-1;justify-content:center}#leads-review .is-mobile .at-extra,#leads-review .is-mobile .at-vehicle{grid-template-columns:1fr;max-width:none}#leads-review .is-mobile .at-table-wrap{display:none}#leads-review .is-mobile .at-mobile-results{display:block}#leads-review .is-mobile .at-product input{font-size:16px}#leads-review .is-mobile input,#leads-review .is-mobile select{font-size:16px;min-height:44px}#leads-review .is-mobile button{min-height:44px}#leads-review .is-mobile .at-pagination{flex-direction:column;align-items:stretch}#leads-review .is-mobile .at-page-controls{justify-content:space-between}#leads-review .is-mobile .at-page-controls select{min-height:44px}#leads-review .is-mobile .at-applied{flex-wrap:wrap}#leads-review .at-customer{padding:14px;border-bottom:1px solid var(--at-line);display:grid;gap:8px}#leads-review .at-customer-head{display:flex;gap:8px;justify-content:space-between;align-items:center}#leads-review .at-customer-head .at-name{font-size:15px}#leads-review .at-customer p{font-size:13px;overflow-wrap:anywhere}#leads-review .at-customer .at-meta{display:flex;justify-content:space-between;color:var(--at-muted);font-size:12px}#leads-review .at-customer details{font-size:13px}#leads-review .at-customer summary{color:var(--at-blue);padding-top:4px;cursor:pointer}#leads-review .at-customer details>div{display:grid;gap:7px;padding-top:12px}#leads-review .at-customer details .at-actions{display:flex}
#leads-review .at-product .at-mobile-menu{display:none}#leads-review .is-mobile .at-mobile-menu{display:inline-flex;border:0;padding:4px}

<script>
(()=>{
const root=document.getElementById('leads-review');
const product=root.querySelector('.at-product');
const $=s=>root.querySelector(s);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v).trim().toLowerCase();
const stages=['New','Contacted','Visited','Appointment','Test Drive','Negotiation','Delivered','Closed'];
const cars=[['Volkswagen','Tiguan'],['Volkswagen','Golf'],['Toyota','RAV4'],['Honda','Civic'],['Ford','Escape'],['Hyundai','Tucson']];
const names=['Alex Chen','Jordan Patel','Taylor Wong','Sam Wilson','Morgan Lee','Casey Martin','Jamie Singh','Riley Brown','Avery Garcia','Quinn Davis'];
const data=Array.from({length:101},(_,i)=>{const car=cars[i%6],stage=stages[i%8];return{id:i+1,name:names[i%10]+(i>=10?' '+(Math.floor(i/10)+1):''),email:'lead'+(i+1)+'@example.test',phone:'416555'+String(1000+i),status:stage==='Delivered'||stage==='Closed'?stage:i%7===1?'Lost':'Active',stage,score:stage==='Delivered'||stage==='Closed'||i%7===1?0:[42,55,78,84,105,135][i%6],year:String(2026-i%3),make:car[0],model:car[1],trade:i%3===0,last:i%4===0?'—':'2026-11-'+String(13-i%10).padStart(2,'0')};});
const fields=['status','stage','trade','score','year','make','model'];
let state={search:'',status:'',stage:'',trade:'',score:'',year:'',make:'',model:'',page:1,size:10,expanded:false,mobile:false};
const density={row:'Standard'};
const makeMatches=(make,input)=>{const n=norm(input);return !n||norm(make).includes(n)||((n==='vw'||n==='volkswagen')&&['vw','volkswagen'].includes(norm(make)));};
const yearMatches=(r,v)=>!norm(v)||r.year.includes(norm(v));
const unique=xs=>[...new Set(xs)].sort();
function choices(){return{year:unique(data.map(r=>r.year)).reverse(),make:unique(data.filter(r=>yearMatches(r,state.year)).map(r=>r.make)),model:unique(data.filter(r=>yearMatches(r,state.year)&&makeMatches(r.make,state.make)).map(r=>r.model))};}
function setSuggestions(){const o=choices();for(const f of ['year','make','model'])$('#at-'+(f==='year'?'years':f==='make'?'makes':'models')).innerHTML=o[f].map(v=>'<option value="'+escape(v)+'"></option>').join('');}
function matching(){return data.filter(r=>(!norm(state.search)||[r.name,r.email,r.phone].some(v=>norm(v).includes(norm(state.search))))&&(!state.status||r.status===state.status)&&(!state.stage||r.stage===state.stage)&&(!state.trade||r.trade===(state.trade==='yes'))&&(!state.score||state.score==='low'&&r.score<50||state.score==='mid'&&r.score>=50&&r.score<=79||state.score==='high'&&r.score>=80)&&yearMatches(r,state.year)&&makeMatches(r.make,state.make)&&(!norm(state.model)||norm(r.model).includes(norm(state.model))));}
const title={search:'Search',status:'Status',stage:'Stage',trade:'Trade-in',score:'Score',year:'Year',make:'Make',model:'Model'};
function value(f){return f==='trade'?(state[f]==='yes'?'Yes':'No'):f==='score'?({low:'Below 50',mid:'50–79',high:'80+'}[state[f]]):state[f];}
function status(r){return '<span class="at-status"><span class="at-dot '+r.status.toLowerCase()+'"></span>'+escape(r.status)+'</span>';}
function actions(r){return '<div class="at-actions"><button type="button" data-brief="'+r.id+'" aria-label="View lead brief for '+escape(r.name)+'"><i data-lucide="eye" aria-hidden="true"></i></button><button type="button" disabled aria-label="Edit '+escape(r.name)+'"><i data-lucide="pencil" aria-hidden="true"></i></button><button type="button" disabled aria-label="Delete '+escape(r.name)+'"><i data-lucide="trash-2" aria-hidden="true"></i></button></div>';}
let announcement;
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:'结果优先',view:state.mobile?'mobile':'desktop',advanced:state.expanded,density:density.row},privateContent:state}).catch(()=>{});}
function render(){
product.classList.toggle('is-mobile',state.mobile);product.style.setProperty('--at-row',density.row==='Compact'?'52px':'64px');
for(const b of root.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String((b.dataset.view==='mobile')===state.mobile));
$('.at-more').setAttribute('aria-expanded',String(state.expanded));$('#at-advanced').hidden=!state.expanded;$('.at-chevron').textContent=state.expanded?'⌃':'⌄';
const advanced=fields.slice(2).filter(f=>norm(state[f])).length;$('.at-advanced-count').hidden=!advanced;$('.at-advanced-count').textContent=advanced;
const active=['search',...fields].filter(f=>norm(state[f]));$('.at-applied').hidden=!active.length;$('.at-search-clear').hidden=!state.search;
$('.at-chips').innerHTML=active.map(f=>'<button type="button" class="at-chip" data-remove="'+f+'" aria-label="Remove '+escape(title[f]+': '+value(f))+'">'+escape(title[f]+': '+value(f))+' <span aria-hidden="true">×</span></button>').join('');
const rows=matching(),pages=Math.max(1,Math.ceil(rows.length/state.size));state.page=Math.min(state.page,pages);const start=(state.page-1)*state.size,visible=rows.slice(start,start+state.size);
clearTimeout(announcement);announcement=setTimeout(()=>{$('.at-count').textContent=active.length?rows.length+' of '+data.length+' leads':data.length+' leads';},300);
$('.at-empty').hidden=!!rows.length;$('.at-table-wrap').hidden=!rows.length;$('.at-mobile-results').hidden=!rows.length;$('.at-pagination').hidden=!rows.length;
$('tbody').innerHTML=visible.map(r=>'<tr><td>'+status(r)+'</td><td><button class="at-name" type="button" data-brief="'+r.id+'">'+escape(r.name)+'</button></td><td>'+escape(r.email)+'<small>'+r.phone+'</small></td><td>'+r.year+' '+r.make+' '+r.model+'</td><td>'+(r.trade?'2023 Toyota Corolla':'No')+'</td><td>'+r.stage+'</td><td>'+r.score+'</td><td>'+r.last+'</td><td>'+actions(r)+'</td></tr>').join('');
$('.at-mobile-results').innerHTML=visible.map(r=>'<article class="at-customer"><div class="at-customer-head"><button class="at-name" type="button" data-brief="'+r.id+'">'+escape(r.name)+'</button>'+status(r)+'</div><div class="at-meta"><span>'+r.stage+'</span><span>Score '+r.score+'</span></div><p>'+r.year+' '+r.make+' '+r.model+'</p><p>'+escape(r.email)+'</p><details><summary>Contact & details</summary><div><p>Phone: '+r.phone+'</p><p>Trade-in: '+(r.trade?'2023 Toyota Corolla':'No')+'</p><p>Last contact: '+r.last+'</p>'+actions(r)+'</div></details></article>').join('');
$('.at-range').textContent=rows.length?(start+1)+'–'+Math.min(start+state.size,rows.length)+' of '+rows.length:'0 results';$('.at-page-num').textContent=state.page+' / '+pages;$('.at-prev').disabled=state.page===1;$('.at-next').disabled=state.page===pages;$('.at-size').value=String(state.size);setSuggestions();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
}
function sync(){ $('input[type=search]').value=state.search;for(const f of fields)$('[data-filter='+f+']').value=state[f];}
function reconcile(f){const removed=[];if(f==='year'&&norm(state.make)&&!choices().make.some(m=>makeMatches(m,state.make))){state.make='';removed.push('Make');}if((f==='year'||f==='make')&&norm(state.model)&&!choices().model.some(m=>norm(m).includes(norm(state.model)))){state.model='';removed.push('Model');}$('.at-dependency').textContent=removed.length?removed.join(' and ')+' cleared because the vehicle selection changed.':'';}
function reset(){state.search='';for(const f of fields)state[f]='';state.page=1;$('.at-dependency').textContent='';sync();render();save();$('input[type=search]').focus();}
function pageBy(delta){state.page+=delta;render();save();$('.at-prev').disabled?$('.at-next').focus():$('.at-prev').focus();}
$('input[type=search]').addEventListener('input',e=>{state.search=e.target.value;state.page=1;$('.at-summary').hidden=true;render();save();});
for(const f of fields)$('[data-filter='+f+']').addEventListener('input',e=>{state[f]=e.target.value;state.page=1;reconcile(f);sync();render();save();});
$('.at-more').onclick=()=>{state.expanded=!state.expanded;render();save();};
$('.at-collapse').onclick=()=>{state.expanded=false;render();save();$('.at-more').focus();};
$('#at-advanced').addEventListener('keydown',e=>{if(e.key==='Escape'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='SELECT'){$('.at-collapse').click();}});
$('.at-search-clear').onclick=()=>{state.search='';state.page=1;sync();render();save();$('input[type=search]').focus();};
$('.at-reset').onclick=reset;$('.at-empty-clear').onclick=reset;
$('.at-size').onchange=e=>{state.size=Number(e.target.value);state.page=1;render();save();};$('.at-prev').onclick=()=>pageBy(-1);$('.at-next').onclick=()=>pageBy(1);
root.addEventListener('click',e=>{const remove=e.target.closest('[data-remove]');if(remove){const f=remove.dataset.remove;state[f]='';state.page=1;reconcile(f);sync();render();save();const next=$('[data-remove]');(next||$('input[type=search]')).focus();}const brief=e.target.closest('[data-brief]');if(brief){const r=data.find(x=>x.id===Number(brief.dataset.brief));$('.at-summary').hidden=false;$('.at-summary-content').innerHTML='<h3>'+escape(r.name)+'</h3><dl><dt>Status / Stage</dt><dd>'+r.status+' / '+r.stage+'</dd><dt>Contact</dt><dd>'+escape(r.email)+' · '+r.phone+'</dd><dt>Vehicle interest</dt><dd>'+r.year+' '+r.make+' '+r.model+'</dd><dt>Trade-in vehicle</dt><dd>'+(r.trade?'2023 Toyota Corolla':'No')+'</dd><dt>Score / Last contact</dt><dd>'+r.score+' / '+r.last+'</dd></dl>';$('.at-close').focus();}});
$('.at-close').onclick=()=>{$('.at-summary').hidden=true;$('input[type=search]').focus();};
for(const b of root.querySelectorAll('[data-view]'))b.onclick=()=>{state.mobile=b.dataset.view==='mobile';state.size=state.mobile?5:10;state.page=1;render();save();};
function restore(snapshot){const saved=snapshot?.privateContent;if(saved&&typeof saved.mobile==='boolean'){for(const k of Object.keys(state))if(typeof saved[k]===typeof state[k])state[k]=saved[k];state.size=[5,10,25,50,100].includes(state.size)?state.size:10;state.page=Math.max(1,Math.floor(state.page));}}
restore(window.openai?.widgetState);
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);sync();render();}});
sync();render();
if(globalThis.Tweak){const tweak=new Tweak({container:product,onChange:()=>{render();save();}});tweak.addSelect(density,'row',{label:'Table density',options:['Standard','Compact']});}
})();
</script>
