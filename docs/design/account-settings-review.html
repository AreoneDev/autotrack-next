<div id="at-account-review">
  <div class="viz-carousel" aria-label="账号与 Settings 设计状态" data-previous-label="上一视图" data-next-label="下一视图">

<script>
(()=>{
const root=document.getElementById('at-account-review');
const email='pengyuwang777@gmail.com';
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const options={outcome:'成功',identity:'示例姓名'};
const previews=[];
const remembered=window.openai?.widgetState?.privateContent;
root.querySelectorAll('[data-preview]').forEach((host,index)=>{
 const mode=host.dataset.preview;
 const s={page:mode==='settings'?'settings':'dashboard',collapsed:mode==='collapsed',menu:mode!=='settings',drawer:mode==='mobile',name:'Pengyu Wang',draft:'Pengyu Wang',busy:false,status:'',error:'',confirm:null,returnFocus:null,signedOut:false};
 const saved=remembered?.[mode];
 if(saved&&['dashboard','settings'].includes(saved.page)){s.page=saved.page;s.collapsed=!!saved.collapsed;s.drawer=!!saved.drawer;s.menu=!!saved.menu;}
 const isMobile=mode==='mobile';
 const dirty=()=>s.name!==s.draft;
 const label=()=>options.identity==='通用账号名'?'AutoTrack account':s.name;
 const initials=()=>options.identity==='通用账号名'?'P':s.name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
 const avatar=()=>`<span class="at-avatar">${escape(initials())}</span>`;
 function persist(){if(!window.openai?.setWidgetState)return;const snapshot={};previews.forEach(p=>{snapshot[p.mode]={page:p.s.page,collapsed:p.s.collapsed,drawer:p.s.drawer,menu:p.s.menu};});window.openai.setWidgetState({modelContent:{design:'account-settings',view:mode,page:s.page},privateContent:snapshot}).catch(()=>{});}
 function menu(){return `<div class="at-popover" id="at-menu-${index}" aria-label="Account actions" ${!isMobile&&!s.menu?'hidden':''}><div class="at-pop-head"><strong>${escape(label())}</strong><div class="at-email">${email}</div></div><button type="button" data-action="settings" class="at-menu-action ${s.page==='settings'?'at-selected':''}" ${s.page==='settings'?'aria-current="page"':''}>${icon('settings')}<span>Settings</span></button><div class="at-sep"></div><button type="button" data-action="signout" class="at-menu-action at-danger" ${s.busy?'disabled':''}>${icon('log-out')}<span>${s.busy?'Signing out…':'Sign out'}</span></button>${s.error&&s.error.startsWith('Sign out')?`<p role="alert" class="at-error">${escape(s.error)}</p>`:''}</div>`;}
 function settings(){return `<button type="button" class="at-back" data-action="dashboard">${icon('arrow-left')} Back to Dashboard</button><section class="at-panel" aria-label="Profile"><div class="at-panel-head"><h3>Profile</h3><p>Your name as it appears in AutoTrack.</p></div><div class="at-panel-body"><div class="at-profile-row">${avatar()}<div><strong>${escape(label())}</strong><small>Initials from your display name</small></div></div><form id="at-form-${index}" novalidate><label for="at-name-${index}">Display name</label><input id="at-name-${index}" name="display-name" value="${escape(s.draft)}" autocomplete="off" maxlength="80" aria-describedby="at-name-help-${index}" ${s.busy?'disabled':''}><p id="at-name-help-${index}" class="at-help">1–60 characters. Visible only in your account.</p>${s.error&&!s.error.startsWith('Sign out')?`<p role="alert" class="at-error">${escape(s.error)}</p>`:''}<div class="at-actions"><button type="submit" class="at-btn at-primary" data-action="save" ${!dirty()||s.busy?'disabled':''}>${s.busy?'Saving…':'Save changes'}</button><button type="button" class="at-btn" data-action="cancel" ${!dirty()||s.busy?'disabled':''}>Cancel</button><span role="status" class="at-status">${escape(s.status)}</span></div></form></div></section><section class="at-panel" aria-label="Sign-in"><div class="at-panel-head"><h3>Sign-in</h3><p>The email address you use to access AutoTrack.</p></div><div class="at-panel-body"><small>Email address</small><div class="at-email" style="font-size:14px;color:var(--at-ink)">${email}</div><p class="at-help">Use a password or an email link on the sign-in page.</p></div></section><section class="at-panel" aria-label="Session"><div class="at-panel-body at-data-row"><div><h3>Current session</h3><p class="at-help">Sign out on this device.</p></div><button type="button" class="at-btn at-danger" data-action="signout" ${s.busy?'disabled':''}>${s.busy?'Signing out…':'Sign out'}</button></div>${s.error.startsWith('Sign out')?`<p role="alert" class="at-error">${escape(s.error)}</p>`:''}</section>`;}
 function dashboard(){return `<div class="at-stats">${[['calendar-check',"Today’s Tasks",'0','Scheduled work due today'],['triangle-alert','High Priority Leads','0','Need immediate attention today'],['message-square','Unreplied Messages','0','Customer replies waiting for response'],['clock','Overdue Follow-ups','661','Missed or past-due scheduled actions']].map(([i,l,n,h])=>`<section class="at-stat"><span class="at-stat-icon">${icon(i)}</span><p>${l}</p><b>${n}</b><small>${h}</small></section>`).join('')}</div><section class="at-tasks"><h3>Today’s Tasks</h3><p class="at-help">Planned work for today only.</p><div class="at-empty">No tasks scheduled for today.</div></section>`;}
 function render(){
 if(s.signedOut){host.innerHTML=`<div class="at-shell ${isMobile?'at-mobile':''}"><div class="at-signed-out"><div><div class="at-avatar">${icon('check')}</div><h2>Signed out</h2><p>登录页面 · 仅演示状态</p><button type="button" class="at-btn at-primary" data-action="restart">Back to preview</button></div></div></div>`;bind();icons();return;}
 host.innerHTML=`<div class="at-shell ${s.collapsed&&!isMobile?'at-collapsed':''} ${isMobile?'at-mobile':''} ${isMobile&&s.drawer?'at-drawer':''}" aria-label="AutoTrack ${mode} preview"><aside class="at-side" ${isMobile&&!s.drawer?'hidden':''}><div class="at-brand"><span class="at-brandmark">${icon('car-front')}</span><div class="at-brand-label"><strong>AutoTrack</strong><small>CRM</small></div><button type="button" class="at-icon at-collapse" data-action="collapse" aria-label="${isMobile?'Close navigation':s.collapsed?'Expand sidebar':'Collapse sidebar'}">${icon(isMobile?'x':s.collapsed?'chevron-right':'chevron-left')}</button></div><nav class="at-nav" aria-label="Primary navigation">${[['layout-dashboard','Dashboard','dashboard'],['users','Leads','leads'],['calendar-days','Agenda','agenda'],['chart-no-axes-column','Analytics','analytics']].map(([i,l,p])=>`<button type="button" data-action="${p==='dashboard'?'dashboard':'business'}" aria-label="${l}" ${s.page===p?'aria-current="page"':''}>${icon(i)}<span>${l}</span></button>`).join('')}</nav><div class="at-account-wrap">${menu()}${isMobile?`<div class="at-trigger">${avatar()}<div class="at-identity"><strong>${escape(label())}</strong><small>${email}</small></div></div>`:`<button type="button" class="at-trigger" data-action="account" aria-label="Account, ${email}" aria-expanded="${s.menu}" aria-controls="at-menu-${index}">${avatar()}<span class="at-identity"><strong>${escape(label())}</strong><small>${email}</small></span>${icon('chevrons-up-down')}</button>`}</div></aside>${isMobile&&s.drawer?'<button type="button" class="at-scrim" data-action="drawer-close" aria-label="Close navigation"></button>':''}<div class="at-main"><header class="at-header"><button type="button" class="at-icon at-hamburger" data-action="drawer-open" aria-label="Open navigation" aria-expanded="${s.drawer}">${icon('menu')}</button><div><h2>${s.page==='settings'?'Settings':'Dashboard'}</h2><p>${s.page==='settings'?'Manage your personal AutoTrack account.':"Overview of today’s priorities and follow-up actions."}</p></div><div class="at-header-meta"><span class="at-icon" aria-label="Notifications">${icon('bell')}</span><span class="at-meta">${icon('calendar-days')} Nov 7, 2026</span><span class="at-meta">${icon('clock')} 09:44 a.m.</span></div></header><div class="at-content">${s.page==='settings'?settings():dashboard()}</div></div>${s.confirm?`<div class="at-dialog-layer"><div class="at-dialog" role="dialog" aria-modal="true" aria-labelledby="at-dialog-title-${index}"><h3 id="at-dialog-title-${index}">Discard unsaved changes?</h3><p>Your display name hasn’t been saved.</p><div class="at-actions"><button type="button" class="at-btn at-primary" data-action="stay">Stay</button><button type="button" class="at-btn" data-action="discard">Discard changes</button></div></div></div>`:''}</div><div class="at-caption"><span>${isMobile?'移动端：抽屉内直接显示账号操作':s.page==='settings'?'Settings：Profile / Sign-in / Session':'底部头像 → 账号菜单 → Settings / Sign out'}</span><span>交互预览 · 姓名为示例</span></div>`;
 if(isMobile){const wrap=host.querySelector('.at-account-wrap');const trigger=wrap?.querySelector('.at-trigger');if(wrap&&trigger)wrap.prepend(trigger);}
 bind();icons();
 }
 function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
 function leave(action,button){if(s.busy)return;if(dirty()){s.confirm=action;s.returnFocus=button?.dataset.action||'dashboard';render();host.querySelector('[data-action="stay"]').focus();return;}act(action);}
 function act(action){if(action==='signout'){signout();return;}s.page=action==='settings'?'settings':'dashboard';s.menu=false;s.drawer=false;s.status='';s.error='';render();persist();}
 function updateButtons(){host.querySelectorAll('[data-action="save"],[data-action="cancel"]').forEach(b=>b.disabled=!dirty()||s.busy);const status=host.querySelector('.at-status');if(status)status.textContent='';}
 async function signout(){s.busy=true;s.error='';render();await new Promise(r=>setTimeout(r,650));s.busy=false;if(options.outcome==='失败'){s.error='Sign out failed. Please try again.';s.menu=true;}else{s.signedOut=true;s.menu=false;s.drawer=false;}render();}
 async function save(){if(s.busy||!dirty())return;const value=s.draft.trim();if(!value||value.length>60){s.error='Enter a display name between 1 and 60 characters.';s.status='';render();host.querySelector('input').focus();return;}s.busy=true;s.error='';s.status='';render();await new Promise(r=>setTimeout(r,650));s.busy=false;if(options.outcome==='失败'){s.error='Couldn’t save your name. Please try again.';}else{s.name=value;s.draft=value;s.status='Saved';}render();}
 function bind(){
 host.querySelector('form')?.addEventListener('submit',e=>{e.preventDefault();save();});
 host.querySelector('input')?.addEventListener('input',e=>{s.draft=e.target.value;s.status='';updateButtons();});
 host.querySelector('input')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save();}});
 host.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',event=>{
 const a=button.dataset.action;
 if(a==='save'){event.preventDefault();save();return;}
 if(a==='settings'||a==='dashboard'||a==='signout'){leave(a,button);return;}
 if(a==='account'){s.menu=!s.menu;render();if(s.menu)host.querySelector('.at-popover button')?.focus();else host.querySelector('[data-action="account"]')?.focus();persist();}
 if(a==='collapse'){if(isMobile){s.drawer=false;}else{s.collapsed=!s.collapsed;s.menu=false;}render();host.querySelector('[data-action="collapse"]')?.focus();persist();}
 if(a==='drawer-open'){s.drawer=true;render();host.querySelector('[data-action="collapse"]')?.focus();persist();}
 if(a==='drawer-close'){s.drawer=false;render();host.querySelector('[data-action="drawer-open"]')?.focus();persist();}
 if(a==='cancel'){s.draft=s.name;s.error='';s.status='';render();host.querySelector('input')?.focus();}
 if(a==='stay'){const returnAction=s.returnFocus;s.confirm=null;render();host.querySelector(`[data-action="${returnAction}"]`)?.focus();}
 if(a==='discard'){const next=s.confirm;s.confirm=null;s.draft=s.name;act(next);}
 if(a==='restart'){s.signedOut=false;s.page='dashboard';s.drawer=isMobile;s.menu=!isMobile;s.draft=s.name;render();}
 if(a==='business'){const caption=host.querySelector('.at-caption');if(caption)caption.firstElementChild.textContent='本稿仅预览账号入口与 Settings；业务页面保持现有设计。';}
 }));
 }
 host.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(s.confirm){s.confirm=null;render();host.querySelector('input')?.focus();}else if(s.menu&&!isMobile){s.menu=false;render();host.querySelector('[data-action="account"]')?.focus();}else if(isMobile&&s.drawer){s.drawer=false;render();host.querySelector('[data-action="drawer-open"]')?.focus();}}
 if(e.key==='Tab'){
 const scope=host.querySelector('.at-dialog')||(isMobile&&s.drawer?host.querySelector('.at-side'):null);
 if(scope){const items=Array.from(scope.querySelectorAll('button:not(:disabled),input:not(:disabled)'));const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
 }
 });
 host.addEventListener('click',e=>{if(s.menu&&!isMobile&&!e.target.closest('.at-account-wrap')){s.menu=false;render();}});
 previews.push({mode,s,render});render();
});
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>previews.forEach(p=>p.render())});tweak.addSelect(options,'outcome',{label:'模拟保存 / 退出结果',options:['成功','失败']});tweak.addSelect(options,'identity',{label:'账号名称',options:['示例姓名','通用账号名']});}
window.addEventListener('openai:set_globals',e=>{const snapshot=e.detail?.globals?.widgetState?.privateContent;if(!snapshot)return;previews.forEach(p=>{const value=snapshot[p.mode];if(!value||!['dashboard','settings'].includes(value.page)||p.s.busy||p.s.confirm)return;p.s.page=value.page;p.s.menu=!!value.menu;p.s.drawer=!!value.drawer;p.s.collapsed=!!value.collapsed;p.render();});});
})();
</script>
