name: Nonfunctional regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Security, performance and bounded load
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:nfr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonfunctional-browser
          path: nfr-reports/
          retention-days: 14
  dependencies:
    name: Dependency vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:dependencies
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: nfr-reports/
          retention-days: 14
  recovery:
    name: Isolated PostgreSQL backup and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker pull postgres:17
      - run: npm run test:recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-evidence
          path: nfr-reports/
          retention-days: 14
